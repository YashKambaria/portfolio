<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F3EF" />
    <style>
      html { background: #F4F3EF; }
      html[data-theme="dark"] { background: #0B1511; color-scheme: dark; }
    </style>
    <script>
      try {
        const savedTheme = localStorage.getItem('yk-portfolio-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
        if (savedTheme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0B1511';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <meta name="description" content="Yash Kambaria — Backend Engineer | Distributed Systems | Cloud-Native Applications" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=optional" rel="stylesheet" />
    <title>Yash Kambaria — Backend Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
